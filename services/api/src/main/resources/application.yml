spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  application:
    name: dreamreel-api
  config:
    import: optional:file:./application-local.yml

  datasource:
    url: jdbc:postgresql://localhost:7052/dreamreel
    username: dreamreel
    password: dreamreel_dev
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 30000
      leak-detection-threshold: 120000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 7053

server:
  port: 7051

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com.dreamreel: INFO

dreamreel:
  # 火山方舟 Seedance（视频直连）
  ark:
    base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com}
    api-key: ${ARK_API_KEY:}
    # 也可由前端 Header X-Ark-Api-Key / 用户设置提供；服务端此项为可选回退
    default-model: ${ARK_DEFAULT_MODEL:doubao-seedance-2-5-260628}
    fast-model: ${ARK_FAST_MODEL:doubao-seedance-2-0-fast-260128}
    image-model: ${ARK_IMAGE_MODEL:doubao-seedream-5-0-260128}
    watermark: ${ARK_WATERMARK:false}
  speech:
    base-url: ${SPEECH_BASE_URL:https://openspeech.bytedance.com}
    app-id: ${SPEECH_APP_ID:}
    access-key: ${SPEECH_ACCESS_KEY:}
    secret-key: ${SPEECH_SECRET_KEY:}
    # 新版控制台「API Key 管理」凭证；配置后优先用 X-Api-Key，无需 app-id/access-key
    api-key: ${SPEECH_API_KEY:}
    default-speaker: ${SPEECH_DEFAULT_SPEAKER:zh_female_xiaohe_uranus_bigtts}
    resource-id: ${SPEECH_RESOURCE_ID:}
    sample-rate: ${SPEECH_SAMPLE_RATE:24000}
  tokenfree:
    base-url: ${TOKENFREE_BASE_URL:https://www.tokenfree.com}
    api-key: ${TOKENFREE_API_KEY:}
    default-model: ${TOKENFREE_DEFAULT_MODEL:doubao-seedance-2-5-260628}
    default-image-model: ${TOKENFREE_DEFAULT_IMAGE_MODEL:nano-banana-2}
    default-image-edit-model: ${TOKENFREE_DEFAULT_IMAGE_EDIT_MODEL:nano-banana-2}
    default-chat-model: ${TOKENFREE_DEFAULT_CHAT_MODEL:qwen-max}
    # 音色生成；须在 TokenFree「模型广场」给当前分组开通后填写，例如 tts-1 / gpt-4o-mini-tts / step-tts-2
    default-tts-model: ${TOKENFREE_DEFAULT_TTS_MODEL:gpt-4o-mini-tts}
  dramaforge:
    process-jobs-inline: ${DRAMA_FORGE_PROCESS_JOBS_INLINE:false}
    job-worker-enabled: ${DRAMA_FORGE_JOB_WORKER_ENABLED:true}
    max-concurrent-jobs: ${DRAMA_FORGE_MAX_CONCURRENT_JOBS:4}
    executor-queue-capacity: ${DRAMA_FORGE_EXECUTOR_QUEUE_CAPACITY:4}
    poll-interval-ms: ${DRAMA_FORGE_POLL_INTERVAL_MS:1000}
    lease-seconds: ${DRAMA_FORGE_LEASE_SECONDS:1800}
    max-attempts: ${DRAMA_FORGE_MAX_ATTEMPTS:3}
    shutdown-await-seconds: ${DRAMA_FORGE_SHUTDOWN_AWAIT_SECONDS:120}
  security:
    jwt-secret: ${JWT_SECRET:dreamreel-dev-secret-key-change-in-production-32b}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:7050,http://127.0.0.1:7050,https://www.dreamreel.com,https://dreamreel.com}
  admin:
    email: ${ADMIN_EMAIL:admin@dreamreel.local}
    password: ${ADMIN_PASSWORD:admin123456}
    display-name: ${ADMIN_DISPLAY_NAME:系统管理员}
    auto-create: ${ADMIN_AUTO_CREATE:true}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./data/media}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:7051/api/v1/media}
    upload-path: ${MEDIA_UPLOAD_PATH:./data/uploads}
    upload-public-base-url: ${MEDIA_UPLOAD_PUBLIC_BASE_URL:http://localhost:7051/api/v1/uploads}
  oss:
    enabled: ${OSS_ENABLED:false}
    endpoint: ${OSS_ENDPOINT:}
    region: ${OSS_REGION:}
    bucket: ${OSS_BUCKET:}
    env-folder: ${OSS_ENV_FOLDER:dev}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}

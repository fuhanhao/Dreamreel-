name: dreamreel

services:
  postgres:
    image: postgres:16-alpine
    container_name: dreamreel-postgres
    environment:
      POSTGRES_DB: dreamreel
      POSTGRES_USER: dreamreel
      POSTGRES_PASSWORD: dreamreel_dev
    ports:
      - "7052:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamreel -d dreamreel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dreamreel-redis
    ports:
      - "7053:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
